services:
  postgres:
    image: postgres:16-alpine
    container_name: jungle_postgres
    environment:
      POSTGRES_DB: jungle_gaming
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD", "bash", "-c", "awslocal sqs list-queues"]
      interval: 5s
      timeout: 5s
      retries: 20

  sqs-init:
    image: amazon/aws-cli:2
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name wager-transactions.fifo --attributes '{"FifoQueue":"true","ContentBasedDeduplication":"true"}' &&
      aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name wager-events.fifo --attributes '{"FifoQueue":"true","ContentBasedDeduplication":"true"}'
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1

volumes:
  postgres_data: